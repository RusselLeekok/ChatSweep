<!doctype html>
<html lang="zh-CN" data-chattidy-fixture="chatgpt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatTidy 本地交互夹具</title>
    <link rel="stylesheet" href="/dist/content.css?v=4">
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #202724;
        background: #eef1ef;
      }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; }
      .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100dvh; }
      nav {
        padding: 18px 12px;
        border-right: 1px solid #d3d9d6;
        background: #f7f8f7;
      }
      nav h2 { margin: 4px 10px 14px; font-size: 14px; }
      .row { position: relative; margin-bottom: 4px; }
      .row a {
        display: block;
        overflow: hidden;
        padding: 10px 38px 10px 12px;
        border-radius: 9px;
        color: inherit;
        text-decoration: none;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row a:hover { background: #e8ecea; }
      .row > button {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 8px;
        color: #6c7672;
        background: transparent;
      }
      main { display: grid; place-items: center; padding: 40px; }
      main div { max-width: 520px; }
      main h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -0.04em; }
      main p { margin: 0; color: #65706b; line-height: 1.7; }
      [role="menu"] {
        position: fixed;
        left: 230px;
        padding: 6px;
        border: 1px solid #cbd2cf;
        border-radius: 10px;
        background: #fafbfa;
        box-shadow: 0 12px 32px rgba(35, 46, 42, .17);
      }
      [role="menuitem"] {
        display: block;
        width: 120px;
        padding: 8px 10px;
        border: 0;
        border-radius: 7px;
        color: #674a47;
        background: transparent;
        text-align: left;
      }
      .native-dialog {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: rgba(32, 39, 36, .28);
      }
      .native-dialog > div {
        width: 300px;
        padding: 18px;
        border-radius: 14px;
        background: #fafbfa;
      }
      .native-dialog h2 { margin: 0 0 6px; font-size: 18px; }
      .native-dialog p { margin: 0 0 16px; color: #69736f; }
      .native-dialog button {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-radius: 9px;
        color: white;
        background: #95645f;
      }
      @media (prefers-color-scheme: dark) {
        :root { color: #e6ebe8; background: #202724; }
        nav { border-color: #3b4541; background: #29312e; }
        .row a:hover { background: #35403c; }
        main p { color: #abb6b1; }
        [role="menu"], .native-dialog > div { border-color: #4b5651; background: #303936; }
      }
    </style>
    <script>
      window.chrome = { runtime: { onMessage: { addListener() {} } } };
    </script>
  </head>
  <body>
    <div class="app">
      <nav aria-label="Chat history">
        <h2>历史聊天</h2>
        <div class="row"><a href="/c/product-notes"><span class="truncate">产品路线图讨论</span></a><button aria-haspopup="menu" aria-label="More">•••</button></div>
        <div class="row"><a href="/c/travel-plan"><span class="truncate">上海周末行程</span></a><button aria-haspopup="menu" aria-label="More">•••</button></div>
        <div class="row"><a href="/c/code-review"><span class="truncate">前端代码审查</span></a><button aria-haspopup="menu" aria-label="More">•••</button></div>
        <div class="row"><a href="/c/reading-list"><span class="truncate">七月阅读清单</span></a><button aria-haspopup="menu" aria-label="More">•••</button></div>
        <div class="row"><a href="/c/meeting-notes"><span class="truncate">周会记录整理</span></a><button aria-haspopup="menu" aria-label="More">•••</button></div>
      </nav>
      <main>
        <div>
          <h1>本地交互夹具</h1>
          <p>这里模拟 AI 网站的聊天侧栏、操作菜单和确认窗口，用于验证 ChatTidy，不包含任何真实账号或聊天数据。</p>
        </div>
      </main>
    </div>
    <script>
      document.addEventListener("click", (event) => {
        const more = event.target.closest(".row > button");
        if (!more) return;
        document.querySelectorAll("[role='menu']").forEach((menu) => menu.remove());
        const row = more.closest(".row");
        const menu = document.createElement("div");
        menu.setAttribute("role", "menu");
        menu.style.top = `${Math.min(more.getBoundingClientRect().top, innerHeight - 80)}px`;
        menu.innerHTML = '<button role="menuitem" data-testid="delete-conversation">删除</button>';
        document.body.appendChild(menu);
        menu.querySelector("button").addEventListener("click", () => {
          menu.remove();
          const overlay = document.createElement("div");
          overlay.className = "native-dialog";
          overlay.setAttribute("role", "dialog");
          overlay.innerHTML = '<div><h2>删除聊天？</h2><p>此操作无法撤销。</p><button data-testid="confirm-delete">确认删除</button></div>';
          document.body.appendChild(overlay);
          overlay.querySelector("button").addEventListener("click", () => {
            row.remove();
            overlay.remove();
          });
        });
      });
    </script>
    <script src="/dist/content.js?v=4"></script>
  </body>
</html>
